<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="760" viewBox="0 0 1340 760" role="img" aria-labelledby="title desc">
  <title id="title">Podcast Summarizer local-first architecture</title>
  <desc id="desc">React Demo and Admin screens call Go HTTP APIs. The backend ingests podcast URLs, runs a local processing job through metadata lookup, audio download, ffmpeg chunking, transcription, summary generation, and persists SQLite records plus local storage artifacts.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <style>
      .title { fill: #1e40af; font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #64748b; font-family: Arial, sans-serif; font-size: 14px; font-weight: 400; }
      .section { fill: #1e40af; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
      .label { fill: #374151; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .small { fill: #64748b; font-family: Arial, sans-serif; font-size: 12px; font-weight: 400; }
      .mono { fill: #22c55e; font-family: Courier, monospace; font-size: 12px; font-weight: 500; }
      .box-primary { fill: #dbeafe; stroke: #1e3a5f; stroke-width: 2; rx: 14; }
      .box-secondary { fill: #eff6ff; stroke: #1e40af; stroke-width: 2; rx: 12; }
      .box-start { fill: #fed7aa; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .box-ai { fill: #ddd6fe; stroke: #6d28d9; stroke-width: 2; rx: 14; }
      .box-success { fill: #a7f3d0; stroke: #047857; stroke-width: 2; rx: 14; }
      .box-storage { fill: #f8fafc; stroke: #1e3a5f; stroke-width: 2; rx: 14; }
      .step { fill: #ffffff; stroke: #1e40af; stroke-width: 1.5; rx: 8; }
      .step-label { fill: #374151; font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .artifact { fill: #1e293b; stroke: #0f172a; stroke-width: 2; rx: 12; }
      .lane { fill: none; stroke: #bfdbfe; stroke-width: 2; stroke-dasharray: 8 8; rx: 22; }
      .arrow { fill: none; stroke: #1e3a5f; stroke-width: 2; marker-end: url(#arrow-blue); }
      .arrow-orange { fill: none; stroke: #c2410c; stroke-width: 2; marker-end: url(#arrow-orange); }
      .arrow-purple { fill: none; stroke: #6d28d9; stroke-width: 2; marker-end: url(#arrow-purple); }
      .thin { fill: none; stroke: #64748b; stroke-width: 1.2; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1340" height="760" fill="#ffffff"/>
  <text x="64" y="56" class="title">Podcast Summarizer Architecture</text>
  <text x="64" y="82" class="subtitle">Local-first portfolio app: React UI, Go API, SQLite persistence, local audio artifacts, and OpenAI-backed live processing.</text>

  <text x="64" y="132" class="section">FRONTEND</text>
  <rect x="48" y="148" width="235" height="202" class="lane"/>
  <rect x="76" y="178" width="180" height="58" class="box-primary"/>
  <text x="166" y="202" text-anchor="middle" class="label">Demo screen</text>
  <text x="166" y="220" text-anchor="middle" class="small">episode list + viewer</text>
  <rect x="76" y="262" width="180" height="58" class="box-primary"/>
  <text x="166" y="286" text-anchor="middle" class="label">Admin screen</text>
  <text x="166" y="304" text-anchor="middle" class="small">submit + status refresh</text>

  <text x="390" y="132" class="section">GO BACKEND</text>
  <rect x="342" y="148" width="628" height="452" class="lane"/>
  <rect x="386" y="178" width="168" height="66" class="box-secondary"/>
  <text x="470" y="204" text-anchor="middle" class="label">HTTP API</text>
  <text x="470" y="223" text-anchor="middle" class="small">ingest / list / detail / status</text>

  <rect x="688" y="178" width="250" height="66" class="box-start"/>
  <text x="813" y="204" text-anchor="middle" class="label">Ingest URL</text>
  <text x="813" y="223" text-anchor="middle" class="small">metadata + duplicate check</text>

  <rect x="386" y="324" width="172" height="62" class="box-secondary"/>
  <text x="472" y="349" text-anchor="middle" class="label">Job manager</text>
  <text x="472" y="367" text-anchor="middle" class="small">persisted stages + errors</text>

  <rect x="688" y="296" width="250" height="118" class="box-secondary"/>
  <text x="813" y="321" text-anchor="middle" class="label">Transcript pipeline</text>
  <text x="813" y="340" text-anchor="middle" class="small">audio to ordered transcript segments</text>
  <rect x="698" y="362" width="60" height="34" class="step"/>
  <text x="728" y="383" text-anchor="middle" class="step-label">download</text>
  <rect x="783" y="362" width="60" height="34" class="step"/>
  <text x="813" y="383" text-anchor="middle" class="step-label">chunk</text>
  <rect x="868" y="362" width="60" height="34" class="step"/>
  <text x="898" y="383" text-anchor="middle" class="step-label">transcribe</text>

  <rect x="688" y="470" width="250" height="62" class="box-ai"/>
  <text x="813" y="495" text-anchor="middle" class="label">Summary generation</text>
  <text x="813" y="513" text-anchor="middle" class="small">mapped segment groups</text>

  <text x="1056" y="132" class="section">LOCAL STATE</text>
  <rect x="1034" y="148" width="248" height="452" class="lane"/>
  <rect x="1068" y="178" width="178" height="66" class="box-storage"/>
  <text x="1157" y="205" text-anchor="middle" class="label">SQLite</text>
  <text x="1157" y="224" text-anchor="middle" class="small">backend/data/podcast.db</text>
  <rect x="1068" y="319" width="178" height="72" class="box-storage"/>
  <text x="1157" y="346" text-anchor="middle" class="label">Local storage</text>
  <text x="1157" y="365" text-anchor="middle" class="small">backend/data/storage</text>
  <rect x="1068" y="470" width="178" height="62" class="box-success"/>
  <text x="1157" y="497" text-anchor="middle" class="label">Mappings</text>
  <text x="1157" y="516" text-anchor="middle" class="small">summary to source segments</text>

  <path d="M 256 207 C 304 207 330 211 386 211" class="arrow"/>
  <path d="M 256 291 C 314 291 333 222 386 222" class="arrow"/>
  <path d="M 554 211 L 688 211" class="arrow"/>
  <path d="M 688 244 C 646 276 594 284 520 324" class="arrow-orange"/>
  <path d="M 558 355 L 688 355" class="arrow"/>
  <path d="M 758 379 L 783 379" class="thin"/>
  <path d="M 843 379 L 868 379" class="thin"/>
  <path d="M 813 414 L 813 470" class="arrow-purple"/>
  <path d="M 938 501 C 990 501 1016 501 1068 501" class="arrow-purple"/>
  <path d="M 938 211 C 990 211 1016 211 1068 211" class="arrow-orange"/>
  <path d="M 938 355 C 990 355 1016 355 1068 355" class="arrow"/>
</svg>
